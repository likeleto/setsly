name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

  # Ручной запуск
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # ── проверка: типы + тесты ──────────────────────────────────
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workout-tracker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workout-tracker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm run test

  # ── сборка и публикация ─────────────────────────────────────
  deploy:
    needs: check
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workout-tracker
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workout-tracker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Verify dist
        run: |
          echo "Listing dist directory:"
          ls -la dist/
          echo "Files in dist/assets:"
          ls -la dist/assets/ 2>/dev/null || echo "No assets directory"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: workout-tracker/dist
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

  # ── Playwright smoke-тест опубликованного сайта ─────────────────
  smoke:
    needs: deploy
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Тот же environment, что у deploy: иначе секреты, добавленные как
    # Secrets окружения github-pages, этому job'у не видны (приходят пустыми).
    environment:
      name: github-pages
    env:
      PAGE_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Ранняя проверка: пустой секрет должен падать здесь,
      # а не выглядеть как «неверный пароль» в smoke-тесте.
      - name: Check smoke secrets
        env:
          SMOKE_TEST_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL }}
          SMOKE_TEST_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD }}
        run: |
          if [ -z "$SMOKE_TEST_EMAIL" ] || [ -z "$SMOKE_TEST_PASSWORD" ]; then
            echo "::error::SMOKE_TEST_EMAIL / SMOKE_TEST_PASSWORD пусты. Добавь их в Repository secrets или в Secrets окружения github-pages."
            exit 1
          fi
          if [ "$SMOKE_TEST_EMAIL" != "$(printf '%s' "$SMOKE_TEST_EMAIL" | tr -d '[:space:]')" ]; then
            echo "::error::SMOKE_TEST_EMAIL содержит пробелы или перевод строки. Перезапиши секрет без них."
            exit 1
          fi
          trimmed=$(printf '%s' "$SMOKE_TEST_PASSWORD" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          if [ "$trimmed" != "$SMOKE_TEST_PASSWORD" ]; then
            echo "::error::SMOKE_TEST_PASSWORD начинается или заканчивается пробелом/переводом строки. Перезапиши секрет без них."
            exit 1
          fi
          echo "SMOKE_TEST_EMAIL и SMOKE_TEST_PASSWORD заданы."

      # GitHub Pages отдаёт свежий деплой не мгновенно: без ожидания
      # smoke-тест ловит 404-страницу вместо приложения.
      - name: Wait for published site
        run: |
          for attempt in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$PAGE_URL")
            if [ "$code" = "200" ]; then
              echo "Site is up (HTTP $code), attempt $attempt"
              exit 0
            fi
            echo "HTTP $code on attempt $attempt, retrying in 2s"
            sleep 2
          done
          echo "::error::Site $PAGE_URL did not respond with 200 within 60s"
          exit 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workout-tracker/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: workout-tracker

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('workout-tracker/package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: workout-tracker

      - name: Run smoke test
        run: npx playwright test
        working-directory: workout-tracker
        env:
          SMOKE_TEST_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL }}
          SMOKE_TEST_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD }}

      # Только скриншоты и error-context: видео и trace могут содержать
      # введённые значения полей, поэтому в артефакты не попадают.
      - name: Upload smoke artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            workout-tracker/test-results/**/test-failed-*.png
            workout-tracker/test-results/**/error-context.md
          if-no-files-found: ignore
          retention-days: 7
